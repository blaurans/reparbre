version: "3.8"

services:
  backend:
    build: ./backend
    ports:
      - "3001:3000"
    volumes:
      - ./backend/data:/app/data
      - ./data/logs:/app/logs
    env_file:
      - ./backend/.env
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "5000:5000"
    volumes:
      - ./frontend/public:/app/public
    restart: unless-stopped

  caddy:
    image: caddy:latest
    ports:
      - "8081:80"
      - "8444:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config: